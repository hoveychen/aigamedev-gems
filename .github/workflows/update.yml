name: Daily archive refresh

on:
  schedule:
    # Every day 06:30 UTC (staggered off the sibling archives)
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: archive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # posts.jsonl / comments.jsonl and their cursors are gitignored, so without a
      # cache every run re-scrapes the whole history from 2022 — ~850 requests and
      # 15-20 minutes. scrape.py is resumable (it reads the cursor and continues), so
      # restoring these four files turns the step into "fetch today's posts": measured
      # 2.3s for 8 new posts and 58 new comments. A cache miss simply falls back to a
      # full scrape, which is what the job did before.
      - name: Restore raw archive
        uses: actions/cache@v4
        with:
          path: |
            posts.jsonl
            comments.jsonl
            .cursor_posts
            .cursor_comments
          # keys must be unique to be written, so stamp the run and fall back to the
          # newest previous archive via the prefix
          key: raw-archive-${{ github.run_id }}
          restore-keys: |
            raw-archive-

      - name: Scrape new posts + comments from Arctic Shift
        run: python3 scrape.py

      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Prefilter
        run: python3 prefilter.py

      # build_data runs twice on purpose. shots.py reads data.json to find media
      # posts, so with a single pass at the end it would only ever see YESTERDAY's
      # index and today's posts would wait a day for their still (caught exactly that
      # locally: new video post 1vblj6i had no still and wasn't even in media/.failed).
      # First pass publishes today's posts, shots.py renders them, second pass writes
      # the `still` paths into data.json / filtered.json / threads/<id>.json. Each
      # pass is a couple of seconds.
      - name: Build browser data (first pass — publishes today's posts)
        run: python3 build_data.py

      - name: Render stills for new media posts
        # Incremental: media/ is committed, so this only pays for posts that appeared
        # since the last run. Capped so one busy day can't turn into an hour-long job;
        # the remainder gets picked up tomorrow (or locally via `python3 shots.py`).
        run: python3 shots.py --workers 6 --limit 400

      - name: Rebuild browser data (second pass — wires in the new stills)
        # classifications.jsonl is produced locally with `claude -p` (classify.py)
        # and committed by hand; this job only refreshes the archive around it.
        # New posts show up as status=pending until the next local classify run.
        run: python3 build_data.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json filtered.json candidates.jsonl threads media
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            STAMP=$(date -u +"%Y-%m-%d")
            git commit -m "Daily archive refresh ($STAMP)"
            # Remote may have advanced (local classify push, overlapping run).
            # Rebase onto it and retry so a non-fast-forward push doesn't fail.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt."
                break
              fi
              echo "Push rejected (attempt $attempt) — rebasing and retrying."
              git pull --rebase origin main
              if [ "$attempt" -eq 5 ]; then
                echo "Push still failing after 5 attempts." >&2
                exit 1
              fi
            done
          fi
